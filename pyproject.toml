[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triage-tape"
version = "0.1.0"
description = "Turn plain-text incident notes into decision-ready Markdown handoffs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Chandan"}]

[project.scripts]
triage-tape = "triage_tape.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
